name: CI Frontend — Build, Lint, Seguridad & SBOM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── JOB 1: Build + Lint + Type-check ──────────────────────────────────────
  build:
    name: "Build & Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # ESLint: detecta errores de código, patrones inseguros y problemas de estilo
      - name: ESLint
        run: npm run lint

      # tsc + vite build: type-check completo + bundle de producción
      - name: Build producción (type-check incluido)
        run: npm run build
        env:
          VITE_API_URL: https://api.metaturnos.com/api

      - name: Subir dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ─── JOB 2: SBOM (CycloneDX) ────────────────────────────────────────────────
  sbom:
    name: "Generar SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Genera el SBOM listando todas las dependencias npm con versiones y licencias
      - name: Generar SBOM
        run: |
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom/frontend-sbom.json \
            --package-lock-only

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: sbom/

  # ─── JOB 3: Snyk — Vulnerabilidades en dependencias npm ────────────────────
  snyk:
    name: "Snyk — Vulnerabilidades"
    runs-on: ubuntu-latest
    needs: build
    # Secret requerido: SNYK_TOKEN

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Snyk test — dependencias npm
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build imagen Docker
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.metaturnos.com/api \
            -t turnero-frontend:${{ github.sha }} .

      - name: Snyk test — imagen Docker
        uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: turnero-frontend:${{ github.sha }}
          args: --severity-threshold=high

  # ─── JOB 4: Deploy via Dokploy ───────────────────────────────────────────────
  deploy:
    name: "Deploy to Hostinger VPS (Dokploy)"
    runs-on: ubuntu-latest
    needs: [build, sbom, snyk]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_FRONTEND_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::El secret DOKPLOY_FRONTEND_WEBHOOK_URL no está configurado."
            echo "Ir a: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
